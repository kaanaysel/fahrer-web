# Das BESTEHENDE Service-Namen und das Daten-Volume beibehalten.
# Bei einem bereits vorhandenen Render-Service Runtime auf Docker umstellen;
# KEINEN neuen Blueprint/Service erstellen.
services:
  - type: web
    name: fahrer-cloud-portal
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORTAL_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: PORTAL_DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false
      # Geheimnisse NICHT in dieser Datei hinterlegen!
      - key: SHIFTBASE_API_TOKEN
        sync: false
      - key: SHIFTBASE_PAYROLL_WEB_SESSION_B64
        sync: false
      - key: SHIFTBASE_PAYROLL_WEB_ENABLED
        value: "1"
    disk:
      name: fahrer-cloud-data
      mountPath: /var/data
      sizeGB: 1
